[package]
name = "whisper-stt"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "whisper_stage"
path = "src/main.rs"

[dependencies]
branchkit-stage-sdk = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
hound = { workspace = true }

# The stage depends on the MIT stage SDK only (out-of-tree buildable — the
# model root arrives via env). Not even as a dev-dependency: its
# end-to-end test drives the built binary through the platform's
# orchestrator in the platform's own end-to-end voice test, so testing this
# crate never compiles the platform.

# Backend per OS: Metal on macOS, CPU elsewhere (vulkan/cuda are future
# opt-ins; pending a CPU-latency measurement of whisper.cpp tiny/base on x86
# that decides whether vulkan moves up).
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.13", features = ["metal"] }

# Windows built by MSVC: ggml's threads run through OpenMP (MSVC's /openmp;
# its runtime, vcomp140.dll, is part of the Visual C++ runtime the stage
# already links). Without it ggml uses its own thread pool, whose waits an
# MSVC build turns into a spin of locked compare-exchanges with no pause
# instruction (ggml.c's atomics shim and ggml_thread_cpu_relax, both for
# gcc/clang only), at every node of the graph. On a 6-core ARM64 Windows
# VM, base.en on a 5 s clip at 4 threads took 39.3 s with ggml's pool and
# 31.9 s with OpenMP (26.1 s at 6). Linux keeps ggml's pool, which is fast
# there and needs no runtime.
#
# A packaged build does not use MSVC for ggml on either Windows
# architecture: MSVC's code for it decodes several times slower even with
# OpenMP (x64, base.en on a 5 s clip on 4 vCPUs: 13.0 s against clang-cl's
# 1.37 s). Built by clang-cl, ggml's own pool waits properly, and
# x86-64-baseline.cmake and aarch64-windows-clang.cmake turn OpenMP off.
# The feature stays on for a plain MSVC build, since cargo cannot tell the
# compilers apart.
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.13", features = ["openmp"] }

[target.'cfg(not(any(target_os = "macos", windows)))'.dependencies]
whisper-rs = { version = "0.13" }
