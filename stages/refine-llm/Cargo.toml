[package]
name = "refine-llm"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "refine_llm"
path = "src/main.rs"

[dependencies]
branchkit-stage-sdk = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# CPU inference first (decided 2026-10-05): OpenMP off because
# macOS has no libomp, and no GPU feature. llama.cpp's own CMake still
# compiles its Metal backend on Apple; the stage asks for zero GPU layers,
# and a Metal grant for the sandbox comes after its denials are measured.

# Metal on macOS, behind the stage's --gpu switch:
# the GPU path needs a sandbox grant, so the stage stays CPU-only unless the
# platform asks and the grant is in place.
[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "=0.1.158", default-features = false }
